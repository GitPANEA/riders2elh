server:
  port: 9443
  # TLS terminato da Tomcat embedded. Il keystore PKCS12 e la sua password non stanno
  # nel repo: il file e sul server (permessi 600, stessa utenza del servizio) e la
  # password arriva da KEYSTORE_PASSWORD nell'EnvironmentFile, come DB_PASSWORD.
  # Attivando ssl la porta 9443 non risponde piu in HTTP: i client vanno aggiornati
  # a https:// nello stesso momento.
  ssl:
    enabled: true
    key-store: file:/opt/riderpay/riderpay-keystore.p12
    key-store-type: PKCS12
    key-store-password: ${KEYSTORE_PASSWORD}
    key-alias: riderpay
    enabled-protocols: TLSv1.3,TLSv1.2

spring:
  datasource:
    url: jdbc:oracle:thin:@//10.10.7.187:1521/SVILUPPO.testsub.prod.oraclevcn.com
    username: CDL0036
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000

logging:
  level:
    org.springframework.jdbc: DEBUG
    org.springframework.jdbc.core.simple.SimpleJdbcInsert: DEBUG
