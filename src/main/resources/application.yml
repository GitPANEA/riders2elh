server:
  servlet:
    # Prefisso di TUTTI i path serviti dall'applicazione, non solo di Swagger:
    # /api/v1/... -> /riders2elh/api/v1/...  e  /oauth2/token -> /riders2elh/oauth2/token.
    # Chi chiama va aggiornato di conseguenza (baseUrl della collection Postman incluso).
    # Minuscolo per coerenza con il package Java e con l'URL concordato; il nome del jar
    # e la unit systemd restano "riders2eLH".
    context-path: /riders2elh

spring:
  application:
    name: riders2eLH
  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST}:${DB_PORT}/${DB_SERVICE}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Endpoint ordinati per tag e per metodo HTTP invece che nell'ordine di scoperta:
    # senza, l'elenco cambia posizione tra un avvio e l'altro.
    tags-sorter: alpha
    operations-sorter: method
    # I payload di esempio (movimentazioni.json ha migliaia di righe) rendono la UI
    # pesante da aprire se espansi di default.
    doc-expansion: none

riders2eLH:
  security:
    jwt:
      # Valore funzionale, non un'etichetta: finisce nel claim "iss" dei token emessi.
      # Resta "riderpay-auth-server" perche cambiarlo invalida i token gia emessi e
      # va concordato con chi li verifica; il rename del progetto non lo tocca.
      issuer: riderpay-auth-server
  batch:
    # Ogni quanti record elaborati (ok+ko) aggiornare NUM_RECORD_OK/KO durante
    # l'elaborazione asincrona, per un polling che mostri progresso reale. Un valore
    # troppo basso moltiplica gli UPDATE su T_BATCH_CARICAMENTO senza reale beneficio;
    # troppo alto rende il polling poco informativo su batch piccoli.
    intervallo-progresso: 1000
    # Da quanti minuti IN_CORSO un batch è segnalato come "probabilmente bloccato" in
    # GET /batch — calcolato in lettura, nessuna scrittura sulla riga. Nessun batch reale
    # dovrebbe restare IN_CORSO così a lungo: superata la soglia è più probabile un task
    # asincrono interrotto (vedi ERRORE_TECNICO in EsitoBatch) che un caricamento lento.
    soglia-bloccato-minuti: 30
